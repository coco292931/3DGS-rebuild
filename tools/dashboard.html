<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>3DGS 训练看板</title>
<style>
  :root{
    --bg:#0d1016; --panel:#141922; --line:#232b38; --text:#dfe6f0;
    --dim:#8394a8; --accent:#7fb2ff; --ok:#4ec98a; --warn:#ffb454; --bad:#ff7b7b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.6 "Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #top{height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  #top h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.5px}
  #top .sp{flex:1}
  button{background:#1c2634;color:var(--text);border:1px solid var(--line);
    border-radius:5px;padding:5px 12px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--accent);color:#fff}
  button.on{background:#1d3category;border-color:var(--accent)}
  #main{display:flex;height:calc(100% - 46px)}
  #left{width:250px;border-right:1px solid var(--line);overflow:auto;background:#111620}
  #mid{flex:1;position:relative;background:#0a0d12}
  #right{width:330px;border-left:1px solid var(--line);overflow:auto;background:#111620}
  iframe{width:100%;height:100%;border:0;display:block}
  .sec{padding:10px 12px;border-bottom:1px solid var(--line)}
  .sec h2{font-size:11px;margin:0 0 8px;color:var(--dim);font-weight:600;
    letter-spacing:1px;text-transform:uppercase}
  .item{padding:7px 9px;border-radius:5px;cursor:pointer;display:flex;
    align-items:center;gap:7px;margin-bottom:3px;border:1px solid transparent}
  .item:hover{background:#1a2230}
  .item.sel{background:#1b2c45;border-color:var(--accent)}
  .dot{width:7px;height:7px;border-radius:50%;background:#3a4453;flex:none}
  .dot.live{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:var(--dim);font-size:11px}
  .ck{font-family:Consolas,monospace;font-size:12px;padding:4px 8px;border-radius:4px;
    cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .ck:hover{background:#1a2230}
  .ck.sel{background:#1b2c45;color:#fff}
  .kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #1d2532}
  .kv span:last-child{font-family:Consolas,monospace}
  .big{font:600 22px/1.2 Consolas,monospace;color:var(--accent)}
  #log{font:11px/1.5 Consolas,monospace;color:#9fb0c4;white-space:pre-wrap;
    max-height:230px;overflow:auto;background:#0b0f16;border-radius:5px;padding:8px}
  #curve{width:100%;height:150px;display:block;background:#0b0f16;border-radius:5px}
  .empty{color:var(--dim);padding:20px;text-align:center;font-size:12px}
  #note{color:var(--dim);font-size:11px}
  #modal{position:fixed;inset:0;background:rgba(6,9,14,.72);display:none;
    align-items:center;justify-content:center;z-index:100}
  #modalbox{width:420px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:20px 22px}
  #modalbox h3{margin:0 0 16px;font-size:15px}
  #modalbox label{display:block;margin-bottom:12px;color:var(--dim);font-size:12px}
  #modalbox select,#modalbox input{width:100%;margin-top:5px;padding:7px 9px;
    background:#0e141c;color:var(--text);border:1px solid var(--line);border-radius:5px;font:inherit}
  #modalbox .row{display:flex;gap:10px;margin-top:18px}
  button.primary{background:#1f4f8f;border-color:#3d7fd6;color:#fff}
  .ds{padding:6px 8px;border-radius:5px;cursor:pointer;margin-bottom:3px}
  .ds:hover{background:#1a2230}
  .ds .t{display:flex;justify-content:space-between}
  .tag{font-size:10px;padding:1px 6px;border-radius:8px;background:#1d2a3d;color:#8fb4e0}
  .tag.ok{background:#16321f;color:#5fd08a}
  .tag.no{background:#33201f;color:#e08a8a}
  .job{padding:6px 8px;border-radius:5px;margin-bottom:4px;background:#0e141c;font-size:12px}
  .job .t{display:flex;justify-content:space-between;gap:8px}
  .job .l{color:var(--dim);font:10px/1.4 Consolas,monospace;max-height:72px;
    overflow:auto;white-space:pre-wrap;margin-top:4px}
</style>
</head>
<body>
<div id="top">
  <h1>3DGS 训练看板</h1>
  <span id="note">—</span>
  <div class="sp"></div>
  <button id="newtrain">＋ 新建训练</button>
  <button id="autobtn" class="on">自动刷新：开</button>
  <button id="refresh">立即刷新</button>
</div>

<div id="modal">
  <div id="modalbox">
    <h3>新建训练</h3>
    <label>数据集 <select id="f_dataset"></select></label>
    <label>后端 <select id="f_backend">
      <option value="cuda">cuda（官方加速后端，快，质量高）</option>
      <option value="torch">torch（纯 PyTorch 自写实现）</option>
    </select></label>
    <label>训练步数 <input id="f_iters" type="number" value="30000"></label>
    <label>下采样 <select id="f_downscale">
      <option value="2">2（640×360，推荐）</option>
      <option value="1">1（原始分辨率，慢 4 倍）</option>
      <option value="3">3（更快，细节少）</option>
    </select></label>
    <label>输出名 <input id="f_out" type="text" placeholder="留空自动命名"></label>
    <div class="row">
      <button id="f_start" class="primary">开始训练</button>
      <button id="f_cancel">取消</button>
    </div>
    <div id="f_msg" class="meta"></div>
  </div>
</div>

<div id="main">
  <div id="left">
    <div class="sec">
      <h2>训练运行</h2>
      <div id="runs"><div class="empty">扫描中…</div></div>
    </div>
    <div class="sec">
      <h2>Checkpoints</h2>
      <div id="cks"><div class="empty">先选一个运行</div></div>
    </div>
    <div class="sec">
      <h2>数据集</h2>
      <div id="datasets"><div class="empty">扫描中…</div></div>
    </div>
    <div class="sec">
      <h2>任务</h2>
      <div id="jobs"><div class="empty">暂无任务</div></div>
    </div>
  </div>

  <div id="mid">
    <div id="viewerHint" class="empty" style="padding-top:80px">选一个 checkpoint 预览</div>
    <iframe id="viewer" style="display:none"></iframe>
  </div>

  <div id="right">
    <div class="sec">
      <h2>指标</h2>
      <div id="metrics"><div class="empty">—</div></div>
    </div>
    <div class="sec">
      <h2>训练曲线（loss，越低越好）</h2>
      <canvas id="curve" width="640" height="300"></canvas>
      <div class="meta" id="curveNote"></div>
    </div>
    <div class="sec">
      <h2>训练日志</h2>
      <div id="log">—</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = { runs: [], datasets: [], jobs: [], selRun: null, selCkpt: null, auto: true, log: [] };

async function api(path) {
  const r = await fetch(path + (path.includes('?') ? '&' : '?') + 't=' + Date.now());
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function refreshRuns() {
  try {
    const d = await api('/api/runs');
    state.runs = d.runs;
    $('note').textContent = `${d.runs.length} 个运行 · 更新于 ${d.time}`;
    renderRuns();
  } catch (e) {
    $('note').textContent = '无法连接后端：' + e.message;
  }
}

function renderRuns() {
  const box = $('runs');
  if (!state.runs.length) { box.innerHTML = '<div class="empty">没有找到训练结果</div>'; return; }
  box.innerHTML = '';
  for (const r of state.runs) {
    const el = document.createElement('div');
    el.className = 'item' + (state.selRun === r.name ? ' sel' : '');
    const nck = r.checkpoints.length;
    el.innerHTML = `<i class="dot ${r.active ? 'live' : ''}"></i>
      <div class="name">${r.name}<div class="meta">${nck} 个 ckpt · ${r.updated.slice(5, 16)}</div></div>`;
    el.onclick = () => selectRun(r.name);
    box.appendChild(el);
  }
}

function renderCks() {
  const box = $('cks');
  const run = state.runs.find(r => r.name === state.selRun);
  if (!run) { box.innerHTML = '<div class="empty">先选一个运行</div>'; return; }
  const list = [...run.checkpoints];
  if (run.has_final) list.push({ name: 'point_cloud.ply', iter: 999999, size_mb: 0, final: true });
  if (!list.length) { box.innerHTML = '<div class="empty">这个运行还没有 checkpoint</div>'; return; }
  box.innerHTML = '';
  for (const c of list) {
    const el = document.createElement('div');
    el.className = 'ck' + (state.selCkpt === c.name ? ' sel' : '');
    el.innerHTML = `<span>${c.final ? '最终模型' : 'iter ' + c.iter}</span>
                    <span class="meta">${c.size_mb ? c.size_mb + 'MB' : ''}</span>`;
    el.onclick = () => selectCkpt(c.name);
    box.appendChild(el);
  }
}

function selectRun(name) {
  state.selRun = name;
  state.selCkpt = null;
  renderRuns(); renderCks();
  loadRunDetail(name);
}

function selectCkpt(file) {
  state.selCkpt = file;
  renderCks();
  const path = file === 'point_cloud.ply'
    ? `/model/${state.selRun}/point_cloud.ply`
    : `/model/${state.selRun}/ckpt/${file}`;
  $('viewerHint').style.display = 'none';
  const v = $('viewer');
  // 首次加载才设 src；之后直接调查看器里的接口换模型，
  // 这样**相机角度和距离保持不变**——对比不同 checkpoint 必须同一视角才有意义。
  if (v.style.display === 'none' || !v.contentWindow ||
      typeof v.contentWindow.loadModelKeepCamera !== 'function') {
    v.style.display = 'block';
    v.src = '/viewer.html?model=' + encodeURIComponent(path);
  } else {
    v.contentWindow.loadModelKeepCamera(path);
  }
}

async function loadRunDetail(name) {
  try {
    const d = await api('/api/run/' + encodeURIComponent(name));
    state.log = d.log || [];
    renderMetrics(d.summary, state.log);
    drawCurve(state.log);
    renderLog(state.log);
  } catch (e) {
    $('metrics').innerHTML = '<div class="empty">读取失败：' + e.message + '</div>';
  }
}

function renderMetrics(sum, log) {
  const box = $('metrics');
  const last = log.length ? log[log.length - 1] : null;
  let html = '';
  if (last) {
    html += `<div class="kv"><span>当前步数</span><span>${last.iter}</span></div>`;
    html += `<div class="kv"><span>loss</span><span>${last.loss?.toFixed(5) ?? '—'}</span></div>`;
    html += `<div class="kv"><span>高斯数</span><span>${last.gaussians?.toLocaleString() ?? '—'}</span></div>`;
    html += `<div class="kv"><span>速度</span><span>${last.sec_per_iter ? last.sec_per_iter.toFixed(3) + ' s/it' : '—'}</span></div>`;
  }
  if (sum) {
    html += `<div class="kv"><span>测试集 PSNR</span><span class="big">${sum.test_psnr?.toFixed(2)} dB</span></div>`;
    html += `<div class="kv"><span>SSIM</span><span>${sum.test_ssim?.toFixed(4)}</span></div>`;
    html += `<div class="kv"><span>基线 PSNR</span><span>${sum.baseline_psnr?.toFixed(2)} dB</span></div>`;
    html += `<div class="kv"><span>分辨率</span><span>${(sum.resolution || []).join('×')}</span></div>`;
    html += `<div class="kv"><span>耗时</span><span>${sum.minutes} 分钟</span></div>`;
    html += `<div class="kv"><span>后端 K</span><span>${sum.K ?? '官方 CUDA'}</span></div>`;
  }
  if (!html) html = '<div class="empty">这个运行还没写出指标</div>';
  box.innerHTML = html;
}

function drawCurve(log) {
  const cv = $('curve');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, pad = 34;
  ctx.clearRect(0, 0, W, H);
  if (log.length < 2) { $('curveNote').textContent = '数据点不足'; return; }
  const ys = log.map(d => d.loss).filter(v => typeof v === 'number');
  const xs = log.map(d => d.iter);
  const x0 = xs[0], x1 = xs[xs.length - 1] || 1;
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padY = (y1 - y0) * 0.1 || 1e-6;
  const X = v => pad + (v - x0) / Math.max(x1 - x0, 1) * (W - pad - 10);
  const Y = v => H - pad - (v - (y0 - padY)) / ((y1 + padY) - (y0 - padY)) * (H - pad - 12);

  ctx.strokeStyle = '#232b38'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, 12); ctx.lineTo(pad, H - pad); ctx.lineTo(W - 10, H - pad); ctx.stroke();
  ctx.fillStyle = '#8394a8'; ctx.font = '10px Consolas';
  ctx.fillText(y1.toFixed(3), 3, 18);
  ctx.fillText(y0.toFixed(3), 3, H - pad);
  ctx.fillText(String(x0), pad, H - 10);
  ctx.fillText(String(x1), W - 46, H - 10);

  ctx.strokeStyle = '#7fb2ff'; ctx.lineWidth = 1.6; ctx.beginPath();
  log.forEach((d, i) => {
    if (typeof d.loss !== 'number') return;
    const px = X(d.iter), py = Y(d.loss);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  });
  ctx.stroke();
  ctx.fillStyle = '#7fb2ff';
  const lastD = log[log.length - 1];
  if (typeof lastD.loss === 'number') {
    ctx.beginPath(); ctx.arc(X(lastD.iter), Y(lastD.loss), 3, 0, 6.284); ctx.fill();
  }
  $('curveNote').textContent = `${log.length} 个记录点 · loss ${y0.toFixed(4)} ~ ${y1.toFixed(4)}`;
}

function renderLog(log) {
  const tail = log.slice(-40);
  $('log').textContent = tail.length
    ? tail.map(d => `[${String(d.iter).padStart(6)}] loss ${d.loss?.toFixed(5)}  高斯 ${d.gaussians}`).join('\n')
    : '（暂无日志）';
  $('log').scrollTop = $('log').scrollHeight;
}

let timer = null;
function setupAuto() {
  if (timer) clearInterval(timer);
  if (state.auto) {
    timer = setInterval(async () => {
      await refreshRuns();
      if (state.selRun) {
        const prev = state.log.length;
        await loadRunDetail(state.selRun);
        if (state.log.length !== prev) renderCks();
      }
    }, 4000);
  }
}

$('refresh').onclick = async () => { await refreshRuns(); if (state.selRun) loadRunDetail(state.selRun); };
$('autobtn').onclick = () => {
  state.auto = !state.auto;
  $('autobtn').textContent = '自动刷新：' + (state.auto ? '开' : '关');
  $('autobtn').classList.toggle('on', state.auto);
  setupAuto();
};

// ---------------------------------------------------------------------------
// 数据集与新建训练
// ---------------------------------------------------------------------------
async function refreshDatasets() {
  try {
    const d = await api('/api/datasets');
    state.datasets = d.datasets || [];
    state.jobs = d.jobs || [];
    renderDatasets();
    renderJobs();
    renderDatasetOptions();
  } catch (e) {
    $('datasets').innerHTML = '<div class="empty">读取失败：' + e.message + '</div>';
  }
}

function renderDatasets() {
  const box = $('datasets');
  if (!state.datasets.length) { box.innerHTML = '<div class="empty">data/ 下没有数据集</div>'; return; }
  box.innerHTML = '';
  for (const d of state.datasets) {
    const el = document.createElement('div');
    el.className = 'ds';
    const tag = d.has_sfm
      ? `<span class="tag ok">已求位姿 ${d.registered}${d.registered >= 0 ? ' 帧' : ''}</span>`
      : `<span class="tag no">未求位姿</span>`;
    el.innerHTML = `<div class="t"><span>${d.name}</span>${tag}</div>
      <div class="meta">${d.images} 张图像 · ${d.kind}</div>`;
    el.title = d.has_sfm ? '点「新建训练」即可用这个数据集' : '需要先跑 SfM（可用命令行 python tools/run_sfm.py）';
    box.appendChild(el);
  }
}

function renderDatasetOptions() {
  const sel = $('f_dataset');
  const want = sel.value;
  sel.innerHTML = state.datasets
    .map(d => `<option value="${d.name}"${d.has_sfm ? '' : ' disabled'}>
        ${d.name}${d.has_sfm ? '（' + d.registered + ' 帧）' : '（未求位姿，不可训练）'}</option>`)
    .join('');
  if (want) sel.value = want;
}

function renderJobs() {
  const box = $('jobs');
  if (!state.jobs.length) { box.innerHTML = '<div class="empty">暂无任务</div>'; return; }
  box.innerHTML = '';
  for (const j of state.jobs) {
    const el = document.createElement('div');
    el.className = 'job';
    el.innerHTML = `<div class="t"><span>${j.cmd}</span>
      <span class="${j.alive ? 'tag ok' : 'tag'}">${j.alive ? '运行中' : '已结束'}</span></div>
      <div class="l" id="jl_${j.id}">加载日志…</div>`;
    box.appendChild(el);
  }
  for (const j of state.jobs) loadJobLog(j.id);
}

async function loadJobLog(id) {
  try {
    const d = await api('/api/joblog?name=' + encodeURIComponent(id));
    const el = $('jl_' + id);
    if (el) { el.textContent = (d.log || '（暂无输出）').split('\n').slice(-8).join('\n');
              el.scrollTop = el.scrollHeight; }
  } catch (e) { /* 忽略 */ }
}

$('newtrain').onclick = () => {
  if (!state.datasets.length) return alert('data/ 下没有数据集');
  $('modal').style.display = 'flex';
  $('f_msg').textContent = '';
};
$('f_cancel').onclick = () => $('modal').style.display = 'none';
$('modal').onclick = e => { if (e.target === $('modal')) $('modal').style.display = 'none'; };

$('f_start').onclick = async () => {
  const body = {
    dataset: $('f_dataset').value,
    backend: $('f_backend').value,
    iters: parseInt($('f_iters').value, 10) || 30000,
    downscale: parseInt($('f_downscale').value, 10) || 2,
    out: $('f_out').value.trim() || undefined,
  };
  $('f_msg').textContent = '正在启动…';
  try {
    const r = await fetch('/api/train', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || ('HTTP ' + r.status));
    $('f_msg').textContent = '已启动：' + d.cmd;
    setTimeout(() => { $('modal').style.display = 'none'; }, 900);
    await refreshDatasets();
  } catch (e) {
    $('f_msg').textContent = '启动失败：' + e.message;
  }
};

(async () => {
  await refreshRuns();
  await refreshDatasets();
  if (state.runs.length && !state.selRun) selectRun(state.runs[0].name);
  setupAuto();
  setInterval(refreshDatasets, 8000);
})();
</script>
</body>
</html>
